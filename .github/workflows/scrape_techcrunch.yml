name: TechCrunch AI Scraper

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies from requirements.txt
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps
      
      - name: Create empty JSON file if not exists
        run: |
          if [ ! -f techcrunch_ai_articles.json ]; then
            echo '{"source":"TechCrunch AI","source_url":"https://techcrunch.com/category/artificial-intelligence/","total_articles":0,"articles":[],"last_updated":"'$(date -Iseconds)'","status":"Initial creation"}' > techcrunch_ai_articles.json
          fi
      
      - name: Run TechCrunch scraper
        run: |
          python techcrunch_scraper.py
      
      - name: Commit and push data
        env:
          BOT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add techcrunch_ai_articles.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update TechCrunch AI data $(date -I)"
            git push https://x-access-token:${BOT_TOKEN}@github.com/rexxgit/bot-dev.git HEAD:main
          fi
