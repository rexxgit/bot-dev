<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ... head content remains the same ... -->

        /* ... existing styles ... */
        
        /* Add these new styles */
        .analytics-link {
            color: #7C3AED;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .analytics-link:hover {
            background: #EEF2FF;
        }
    </style>
</head>
<body>
    <!-- ... body content ... -->
    
    <script>
        // ============================================
        // ANALYTICS TRACKING
        // ============================================
        function trackEvent(eventType, data) {
            try {
                const events = JSON.parse(localStorage.getItem('botEvents') || '[]');
                events.push({
                    type: eventType,
                    data: data,
                    timestamp: new Date().toISOString()
                });
                if (events.length > 1000) events.splice(0, events.length - 1000);
                localStorage.setItem('botEvents', JSON.stringify(events));
            } catch (e) {}
        }

        function getTotalQueries() {
            try {
                const events = JSON.parse(localStorage.getItem('botEvents') || '[]');
                return events.filter(e => e.type === 'query').length;
            } catch (e) {
                return 0;
            }
        }

        function updateTotalQueries() {
            const total = getTotalQueries();
            const sidebarEl = document.getElementById('total-queries-sidebar');
            if (sidebarEl) sidebarEl.textContent = total;
        }

        // ... rest of your existing JavaScript ...

        // Update total queries in sendMessage()
        // Add this line inside your sendMessage function after validating the message:
        // trackEvent('query', { question: message, timestamp: Date.now() });
        // updateTotalQueries();

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateTotalQueries();
            // ... other init code ...
        });
    </script>
</body>
</html>
